map $uri $public_write_limit_key {
    default "";
    ~^/api/coupons/[0-9]+/claim$ $binary_remote_addr;
    ~^/api/checkout/guest/orders/[^/]+$ $binary_remote_addr;
}

limit_req_zone $public_write_limit_key zone=public_writes:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
log_format coupon '$remote_addr "$request_method $uri" $status $request_time $request_id';

server {
    listen 80;
    server_tokens off;
    access_log /var/log/nginx/access.log coupon;
    root /usr/share/nginx/html;
    client_max_body_size 32k;
    limit_req_status 429;
    error_page 429 = @rate_limited;
    add_header X-Request-ID $request_id always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://app:8080;

    location @rate_limited {
        default_type application/json;
        return 429 '{"result":"RATE_LIMITED"}';
    }

    location /api/ {
        limit_req zone=public_writes burst=40 nodelay;
        proxy_pass $backend;
    }

    location /oauth2/ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass $backend;
    }

    location /login/ { proxy_pass $backend; }
    location = /logout { proxy_pass $backend; }
    location /actuator/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
