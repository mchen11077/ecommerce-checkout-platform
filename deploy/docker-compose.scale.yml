# Horizontal-scaling overlay: 3 stateless app replicas behind nginx, each capped at 2 vCPUs.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.scale.yml up -d --scale app=3
#
# The app's fixed host port is removed (!reset) because every replica would otherwise fight for 8080;
# nginx owns 8080 and load-balances to the replicas through Docker DNS.
#
# Caveat: on a fresh volume, start with --scale app=1 and wait for it to become healthy before scaling
# up, because every replica runs schema.sql at startup (CREATE TABLE IF NOT EXISTS is not safe when
# several instances create the same table at the same instant).
services:
  app:
    ports: !reset []
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "2"
          memory: 1536M
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1g"
      # Scaling runs measure the synchronous claim path; persistence is measured separately.
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: ${CONSUMER_AUTO_STARTUP:-true}

  nginx:
    image: nginx:1.27.5-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_started

  k6:
    environment:
      BASE: http://nginx:8080
