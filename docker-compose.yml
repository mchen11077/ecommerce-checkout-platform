name: coupon-coursework
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coupon
      POSTGRES_USER: coupon
      POSTGRES_PASSWORD: coupon
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coupon -d coupon"]
      interval: 3s
      retries: 30

  redis:
    image: redis:7.2-alpine

  kafka:
    image: apache/kafka:3.7.0
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12

  app:
    build: ./app
    ports:
      - "127.0.0.1:${COUPON_APP_PORT:-8080}:8080"
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1g"
      # Step 4.4: false = one INSERT per message, true = batch insert. scripts/run-claim-experiments.ps1 sets CONSUMER_BATCH.
      COUPON_CONSUMER_BATCH: ${CONSUMER_BATCH:-false}
      # Experiment switches (defaults live in application.yml).
      KAFKA_KEY_MODE: ${KAFKA_KEY_MODE:-user}
      COMBINED_RATE_LIMIT: ${COMBINED_RATE_LIMIT:-true}
      VIRTUAL_THREADS: ${VIRTUAL_THREADS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

  k6:
    image: grafana/k6:0.54.0
    profiles: ["test"]
    volumes:
      - ./perf/k6:/scripts
      - ./results:/results
    environment:
      BASE: http://app:8080
