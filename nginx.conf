worker_processes 4;

events {
  worker_connections 20000;
}

http {
  access_log off;
  sendfile on;

  # Docker's embedded DNS. `resolve` + a shared zone makes nginx re-resolve the service name, so
  # scaling the app up/down does not leave dead upstream IPs behind (nginx:1.27.3+).
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream app {
    zone app 64k;
    server app:8080 resolve;
    keepalive 256;
  }

  server {
    listen 8080;
    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
    }
  }
}
